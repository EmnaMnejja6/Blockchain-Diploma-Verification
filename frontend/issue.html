<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Émission d'un diplôme</title>
</head>
<body>
  <h1>Émission d'un diplôme</h1>
  <p><a href="/index.html">Administration des universités</a></p>

  <section>
    <button id="connectBtn">Connecter MetaMask</button>
    <p id="status">Non connecté</p>
  </section>

  <section id="issueSection" hidden>
    <h2>Émettre un diplôme</h2>
    <input id="fileInput" type="file" accept="application/pdf" />
    <p>Empreinte SHA-256 : <code id="hashOut">-</code></p>
    <button id="issueBtn" disabled>Émettre le diplôme</button>
    <p id="message"></p>
    <p>Hash de la transaction : <code id="txOut">-</code></p>
  </section>

  <script type="module" src="/src/issue.js"></script>
</body>
</html>
