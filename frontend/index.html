<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administration des universités</title>
</head>
<body>
  <h1>Administration des universités</h1>

  <section>
    <button id="connectBtn">Connecter MetaMask</button>
    <p id="status">Non connecté</p>
  </section>

  <section id="adminSection" hidden>
    <h2>Ajouter une université</h2>
    <input id="nameInput" placeholder="Nom de l'université" />
    <input id="walletInput" placeholder="Adresse du portefeuille (0x...)" />
    <button id="addBtn">Ajouter</button>
    <p id="message"></p>
  </section>

  <section>
    <h2>Universités enregistrées</h2>
    <table>
      <thead><tr><th>Nom</th><th>Adresse</th><th>Statut</th><th></th></tr></thead>
      <tbody id="list"></tbody>
    </table>
  </section>

  <script type="module" src="/src/admin.js"></script>
</body>
</html>
