<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administration des universités</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <nav class="topbar">
    <a href="/index.html" class="brand">
      <img src="/logo.svg" alt="" width="32" height="32" />
      <span>Diplôme<strong>Chain</strong></span>
    </a>
    <a href="/about.html">À propos</a>
    <div id="userDropdown" class="user-dropdown">
      <button class="user-icon-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </button>
      <div class="dropdown-menu">
        <div class="dropdown-header">
          <span id="userName" class="dropdown-user-name"></span>
        </div>
        <a id="dashboardLink" href="/admin.html" class="dropdown-link">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          <span id="dashboardText">Administration</span>
        </a>
        <button id="logoutBtn" class="dropdown-logout-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          Déconnexion
        </button>
      </div>
    </div>
  </nav>

  <main>
    <header>
      <h1>Administration des universités</h1>
      <p class="subtitle">Déclarez et révoquez les universités autorisées à émettre des diplômes.</p>
      <p id="status" class="status-text">Connecté en tant qu'administrateur</p>
    </header>

    <section id="adminSection">
      <h2>Ajouter une université</h2>
      <input id="nameInput" placeholder="Nom de l'université" />
      <input id="walletInput" placeholder="Adresse du portefeuille (0x...)" />
      <button id="addBtn">Ajouter</button>
      <p id="message"></p>
    </section>

    <section>
      <h2>Universités enregistrées</h2>
      <table>
        <thead><tr><th>Nom</th><th>Adresse</th><th>Statut</th><th></th></tr></thead>
        <tbody id="list"></tbody>
      </table>
    </section>
  </main>

  <script type="module" src="/src/admin.js"></script>
  <script type="module" src="/src/auth.js"></script>
</body>
</html>
